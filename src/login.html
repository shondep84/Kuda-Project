<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Kuda Login Page</title>
      <link rel="stylesheet" href="output.css">
</head>

<body class="bg-gray-200 space-x-0">
      <header>
            <nav class="flex md:justify-between items-center px-6 md:px-10 md:py-5 shadow-xs h-15 fixed w-full bg-white z-10">
                  <div>
                        <img src="./assets/kuda-new-logo.png" alt="kuda-logo" class="w-25 h-9">
                  </div>
                  <div class="text-white flex ml-25 md:ml-100 md:gap-5 items-center">
                        <a href="" class="bg-[#F4F4F4] p-3 w-40 md:w-50 rounded-[10px] text-center text-black outline-1 font-bold hover:scale-105">Open an Account</a>
                  </div>
            </nav>
      </header>

      <main>
            <div class="items-center space-y-0 px-5 py-30 md:px-10 md:py-20">
                  <h1 class="text-center font-bold text-2xl p-5 md:p-10">Sign In To Your Account</h1>
                  <div class=" w-80 md:w-100 mx-auto bg-gray-100 text-black p-5 rounded-[5px] text-[11px] shadow-2xl">
                        <p class="text-center px-5 py-5 p-5">To sign in, please type in the email address linked to your Kuda account.</p>

                        <form action="" class="p-5 px-0 space-y-5">
                              <label for="email" class="">Email Address</label>
                              <input type="email" placeholder="example@gmail.com" required class=" w-70 md:w-90 p-2 shadow-xs border-solid rounded-[5px] text-[12px] mt-2 items-center">

                              <button class="bg-black text-white text-center text-[15px] block mx-auto w-30 p-3 rounded-[10px] cursor-pointer hover:scale-110">Continue</button>
                        </form>
                  </div>
            </div>
      </main>
</body>
</html>
